services:
  warehouse:
    build:
      # Нужны обе папки: Warehouse.API и Warehouse.WebUI
      context: ../..
      dockerfile: Warehouse.API/Warehouse.API/Dockerfile
    image: warehouse:latest
    container_name: warehouse_app
    env_file: .env          # секреты: см. .env.example
    volumes:
      - ./db-data:/app/data   # здесь лежит app.db (не ./data: на Windows это та же папка, что исходники Data/)
    ports:
      - "8080:7485"
    restart: unless-stopped
